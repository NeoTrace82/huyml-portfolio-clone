services:
  huyml-portfolio-clone:
    image: ghcr.io/neotrace82/huyml-portfolio-clone:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      DEFAULT_PROJECTS_PATH: /app/public/projects.json
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "1"
    volumes:
      - /home/debian/portainer/huyml-portfolio-clone:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      proxy:
        aliases:
          - huyml-portfolio-clone

networks:
  proxy:
    external: true
