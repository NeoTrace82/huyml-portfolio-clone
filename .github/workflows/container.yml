name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/neotrace82/huyml-portfolio-clone

jobs:
  verify:
    name: Verify application and CMS
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CMS and test dependencies
        run: pip install --requirement requirements.txt --requirement requirements-dev.txt
      - name: Run CMS tests
        run: pytest -q

  security:
    name: Trivy security gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Scan source and configuration
        run: >-
          trivy fs
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
          .
      - name: Build deployment image
        run: docker build --tag huyml-portfolio-clone:ci .
      - name: Scan deployment image
        run: >-
          trivy image
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
          huyml-portfolio-clone:ci

  publish:
    name: Publish multi-architecture image
    needs: [verify, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
